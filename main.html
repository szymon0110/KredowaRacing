<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KredowaRacing | Drag Racing Events</title>
    <link rel="icon" type="image/png" href="Images/logotrans.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">KREDOWA<span> RACING</span></div>
        <div class="hamburger" id="hamburger">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <ul class="nav-links">
            <li><a href="#home">Start</a></li>
            <li><a href="#stats">O nas</a></li>
            <li><a href="#contact">Kontakt</a></li>
        </ul>
    </nav>

    <section class="hero" id="home">
        <h1>Poczuj 1/4 Mili Emocji</h1>
        <p>Organizujemy najbardziej prestiżowe wyścigi Drag Racing w Szczecinie. Profesjonalny pomiar czasu i najszybsze maszyny.</p>
        <a href="#contact" class="btn">ZAREJESTRUJ SIĘ</a>
    </section>

    <section class="stats" id="stats">
        <div class="stat-card">
            <h2 class="counter" data-target="42">0</h2>
            <p>ZAREJESTROWANYCH KIEROWCÓW</p>
        </div>
        <div class="stat-card">
            <h2 class="counter" data-target="14">0</h2>
            <p>IMPREZ ROCZNIE</p>
        </div>
        <div class="stat-card">
            <h2 class="counter" data-target="210">0</h2>
            <p>KM/H – REKORD TORU</p>
        </div>
    </section>

    <section class="contact" id="contact">
        <h2>Dołącz do wyścigu</h2>
        <form id="racingForm">
            <input type="text" placeholder="Imię i Nazwisko" required>
            <input type="email" placeholder="Twój E-mail" required>
            <textarea rows="5" placeholder="Twoja maszyna (Marka, model, moc)"></textarea>
            <button type="submit" class="btn" style="border:none; cursor:pointer;">WYŚLIJ ZGŁOSZENIE</button>
        </form>
    </section>

    <script src="code.js"></script>
</body>
</html>
